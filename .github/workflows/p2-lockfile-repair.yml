# P2 ONE-TIME repair. Runs only on addition of this workflow to the P2 branch.
# It commits the generated lockfile and removes itself in the SAME branch commit.
name: P2 one-time dependency lock repair
on:
  push:
    branches:
      - feat/p2-customer-catalog-cart
    paths:
      - .github/workflows/p2-lockfile-repair.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'meyecarpenter23842/sichuan-hotpot' && github.ref == 'refs/heads/feat/p2-customer-catalog-cart'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate lockfile (no install scripts, no production)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirm npm ci and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          rm .github/workflows/p2-lockfile-repair.yml
          git add package-lock.json .github/workflows/p2-lockfile-repair.yml
          git diff --cached --exit-code --quiet && { echo "::error::No lockfile update"; exit 1; }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(p2): sync Expo dependency lockfile'
          git push origin HEAD:refs/heads/feat/p2-customer-catalog-cart
