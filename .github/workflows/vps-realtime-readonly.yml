name: VPS realtime Nginx audit (read-only owner command)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  realtime-audit:
    if: >-
      github.event.issue.number == 3 &&
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/audit-hotpot-realtime' &&
      github.actor == 'meyecarpenter23842'
    environment: production-api
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Inspect Nginx routing and local/public upgrade without modifications
        shell: bash
        run: |
          set -euo pipefail
          test "$VPS_USER" = ubuntu
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          (( VPS_PORT >= 1 && VPS_PORT <= 65535 ))
          test -n "$VPS_HOST" && test -n "$VPS_KNOWN_HOSTS" && test -n "$VPS_DEPLOY_SSH_KEY"
          echo "::add-mask::$VPS_HOST"
          umask 077
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/key" >/dev/null
          ssh -T -p "$VPS_PORT" -i "$RUNNER_TEMP/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" 'sudo -n /usr/bin/python3 -' \
            < infra/vps/hotpot-realtime-audit.py > "$RUNNER_TEMP/audit.txt" 2>/dev/null || {
              echo "::error::Read-only audit blocked; no VPS modifications."
              exit 1
            }
          python3 - "$RUNNER_TEMP/audit.txt" <<'PY'
          import re, sys
          names = {
              "nginx_tls_vhosts", "nginx_host_tls_vhosts",
              "nginx_host_tls_ws_locations", "nginx_host_tls_api_upstreams",
              "nginx_default_tls_vhosts", "nginx_tls_ws_locations",
              "backend_upgrade_status", "local_tls_upgrade_status",
              "public_tls_upgrade_status"
          }
          values = {}
          for line in open(sys.argv[1], encoding="utf8"):
              match = re.fullmatch(r"([a-z_]+)=(\d{1,3})\n", line)
              if not match or match.group(1) not in names or match.group(1) in values:
                  raise SystemExit("Rejected unexpected audit output")
              values[match.group(1)] = int(match.group(2))
          if set(values) != names:
              raise SystemExit("Incomplete audit output")
          for k in sorted(values):
              print(k + "=" + str(values[k]))
          PY
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/key" "$RUNNER_TEMP/known_hosts" "$RUNNER_TEMP/audit.txt"
