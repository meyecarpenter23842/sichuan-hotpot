name: Configure production R2 + Google Routes (owner command, no manual SSH)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  configure:
    if: >-
      github.event.issue.number == 3 &&
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/configure-hotpot-services' &&
      github.actor == 'meyecarpenter23842'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production-api
    concurrency:
      group: hotpot-production-vps-change
      cancel-in-progress: false
    env:
      VPS_HOST: ${ vars.VPS_HOST }}
      VPS_PORT: ${ vars.VPS_PORT }}
      VPS_USER: ${ vars.VPS_USER }}
      VPS_KNOWN_HOSTS: ${ secrets.VPS_KNOWN_HOSTS }}
      VPS_DEPLOY_SSH_KEY: ${ secrets.VPS_DEPLOY_SSH_KEY }}
      PRODUCT_R2_ACCESS: ${ secrets.HOTPOT_R2_ACCESS_KEY_ID }}
      PRODUCT_R2_SECRET: ${ secrets.HOTPOT_R2_SECRET_ACCESS_KEY }}
      GOOGLE_ROUTES_KEY: ${ secrets.HOTPOT_GOOGLE_ROUTES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Confirm owner, protected main, pinned host and secret availability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$VPS_USER" = ubuntu
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          (( VPS_PORT >= 1 && VPS_PORT <= 65535 ))
          test -n "$VPS_HOST" && test -n "$VPS_KNOWN_HOSTS" && test -n "$VPS_DEPLOY_SSH_KEY"
          test -n "$PRODUCT_R2_ACCESS" && test -n "$PRODUCT_R2_SECRET" && test -n "$GOOGLE_ROUTES_KEY" || {
            echo "::error::Missing protected production-api environment secrets; no VPS change."
            exit 1
          }
          echo "::add-mask::$VPS_HOST"
          echo "Protected main and required credentials are present (values withheld)."
      - name: Prepare pinned SSH and private configuration payload in runner only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/hotpot-key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/hotpot-hosts"
          chmod 600 "$RUNNER_TEMP/hotpot-key" "$RUNNER_TEMP/hotpot-hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/hotpot-key" >/dev/null 2>&1
          python3 - "$RUNNER_TEMP/hotpot-config.json" <<'PY'
          import json,os,sys
          obj = {
              "R2_ACCOUNT_ID": "bae4e0be81d8f56be5b75402ccd3bb9b",
              "R2_BUCKET": "hot-pot",
              "R2_ACCESS_KEY_ID": os.environ["PRODUCT_R2_ACCESS"],
              "R2_SECRET_ACCESS_KEY": os.environ["PRODUCT_R2_SECRET"],
              "GOOGLE_ROUTES_API_KEY": os.environ["GOOGLE_ROUTES_KEY"],
          }
          path=sys.argv[1]
          fd=os.open(path,os.O_CREAT|os.O_EXCL|os.O_WRONLY,0o600)
          with os.fdopen(fd,"w") as f:
              json.dump(obj,f,separators=(",",":"))
          print("Encrypted-SSH-only service config payload staged on ephemeral runner.")
          PY
      - name: Probe both services; atomically configure API env; restart with rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh_args=(-T -p "$VPS_PORT" -i "$RUNNER_TEMP/hotpot-key"
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/hotpot-hosts" -o ConnectTimeout=10)
          ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" \
            'sudo -n /usr/bin/tee /run/hotpot-services-configure.py >/dev/null && sudo -n /usr/bin/chmod 0700 /run/hotpot-services-configure.py' \
            < infra/vps/hotpot-services-configure.py >/dev/null 2>/dev/null || {
              echo "::error::Pinned-SSH helper staging failed; no credentials sent."
              exit 1
            }
          # Secret JSON is sent only over pinned encrypted SSH stdin to root.
          if ! ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" \
              'sudo -n /usr/bin/python3 /run/hotpot-services-configure.py --apply' \
              < "$RUNNER_TEMP/hotpot-config.json" > "$RUNNER_TEMP/service-results" 2>/dev/null; then
            echo "::error::Provider or health check failed; no secret values logged. Production env unchanged or rolled back."
            exit 1
          fi
          python3 - "$RUNNER_TEMP/service-results" <<'PY'
          import sys
          lines=[line.strip() for line in open(sys.argv[1],encoding="utf8")]
          expected={"r2_product_upload_probe=PASS","google_routes_road_distance_probe=PASS"}
          states={"configuration=APPLIED","configuration=ALREADY_APPLIED"}
          accepted=expected|states|{"health_live=PASS","health_ready=PASS"}
          if any(l not in accepted for l in lines) or not expected.issubset(set(lines)) or not (states & set(lines)):
              raise SystemExit("Invalid sanitized VPS verification; output withheld.")
          if "configuration=APPLIED" in lines and not {"health_live=PASS","health_ready=PASS"}.issubset(set(lines)):
              raise SystemExit("Updated backend did not confirm health.")
          for line in lines: print(line)
          PY
          echo "R2 signed upload, Google driving route and backend readiness: PASS"
      - name: Remove all temporary SSH, secret and root helper files
        if: always()
        shell: bash
        run: |
          if [[ -n "${VPS_USER:-}" && -n "${VPS_HOST:-}" && -f "$RUNNER_TEMP/hotpot-key" && -f "$RUNNER_TEMP/hotpot-hosts" ]]; then
            ssh -T -p "$VPS_PORT" -i "$RUNNER_TEMP/hotpot-key" -o IdentitiesOnly=yes \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/hotpot-hosts" -o ConnectTimeout=10 \
              "$VPS_USER@$VPS_HOST" \
              'sudo -n /usr/bin/rm -f /run/hotpot-services-configure.py' </dev/null >/dev/null 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/hotpot-key" "$RUNNER_TEMP/hotpot-hosts" \
            "$RUNNER_TEMP/hotpot-config.json" "$RUNNER_TEMP/service-results"
