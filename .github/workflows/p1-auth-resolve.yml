name: P1 temporary auth lock and DEV migration resolution
on:
  pull_request:
    branches: [main]
    paths:
      - apps/api/package.json
      - apps/api/prisma/schema.prisma
      - .github/workflows/p1-auth-resolve.yml
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'feat/p1-direct-google-username-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://127.0.0.1:5432/disposable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve lock for Google verification, Argon2, JWT
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate generated Prisma migration
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prisma:validate
          npm exec -- prisma migrate diff --from-schema-datamodel 'apps/api/prisma/schema.prisma' --to-schema-datamodel 'apps/api/prisma/schema.prisma' --exit-code
      - name: Emit exact lockfile only (no credentials)
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const text = fs.readFileSync('package-lock.json','utf8');
          const chunks = Math.ceil(text.length/3500);
          console.log('HOT_POT_AUTH_LOCK_PARTS='+chunks);
          for(let i=0;i<chunks;i++)console.log('HOT_POT_AUTH_LOCK_'+i+'='+JSON.stringify(text.slice(i*3500,(i+1)*3500)));
          JS
