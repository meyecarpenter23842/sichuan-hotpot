name: Fix PWA production CORS (owner only)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  admin-cors:
    concurrency:
      group: hotpot-production-vps-change
      cancel-in-progress: false
    if: >-
      github.event.issue.number == 3 &&
      github.event.issue.pull_request == null &&
      (github.event.comment.body == '/fix-hotpot-pwa-cors' ||
       github.event.comment.body == '/fix-hotpot-admin-cors') &&
      github.actor == 'meyecarpenter23842'
    environment: production-api
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require protected main and approved owner command
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$VPS_USER" = ubuntu
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          (( VPS_PORT >= 1 && VPS_PORT <= 65535 ))
          test -n "$VPS_HOST" && test -n "$VPS_DEPLOY_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS"
          python3 -m unittest discover -s infra/vps/tests -p test_admin_cors.py -v
      - name: Apply Customer/Admin CORS allowlist and verify API with rollback
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh.key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh.key" "$RUNNER_TEMP/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/ssh.key" >/dev/null 2>&1
          ssh-keygen -l -f "$RUNNER_TEMP/known_hosts" >/dev/null 2>&1
          ssh_opts=(-T -p "$VPS_PORT" -i "$RUNNER_TEMP/ssh.key"
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=10)
          outcome="$(ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            'sudo -n /usr/bin/python3 -' < infra/vps/hotpot-admin-cors.py 2>&1)" || {
            echo "::error::PWA CORS update blocked; VPS helper restores the previous API config if necessary."
            printf '%s\n' "$outcome" | grep -E '^pwa_cors=BLOCKED;reason=[a-z_]+$' || true
            exit 1
          }
          grep -Eq '^pwa_cors=(PASS|ALREADY_READY);api_live=PASS;api_ready=PASS$' <<< "$outcome" || {
            echo "::error::PWA CORS proof missing."
            exit 1
          }
          echo "Customer/Admin API CORS and HTTPS/loopback health: PASS"
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ssh.key" "$RUNNER_TEMP/known_hosts"
