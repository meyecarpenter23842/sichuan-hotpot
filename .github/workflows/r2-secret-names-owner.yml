name: Diagnose R2 secret names safely (owner only)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  names-only:
    if: >-
      github.event.issue.number == 3 &&
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/diagnose-hotpot-r2-secrets' &&
      github.actor == 'meyecarpenter23842'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production-api
    env:
      SECRET_VALUES_PRIVATE_JSON: ${{ toJSON(secrets) }}
    steps:
      - name: Print only safe R2-like variable NAMES, never values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          obj = json.loads(os.environ["SECRET_VALUES_PRIVATE_JSON"])
          if not isinstance(obj, dict):
              raise SystemExit("Unexpected secret context")
          # Names only: no values, lengths, hashes, prefixes or debug dumps.
          hits = sorted(
              name for name in obj
              if re.fullmatch(r"[A-Z0-9_]{1,128}", name)
              and re.search(r"R2|CLOUDFLARE|HOTPOT|HOT_POT|BUCKET", name)
          )
          print("matching_r2_secret_names=" + (",".join(hits) if hits else "NONE"))
          required = {"HOTPOT_R2_ACCESS_KEY_ID", "HOTPOT_R2_SECRET_ACCESS_KEY"}
          print("expected_r2_names_present=" + ("YES" if required.issubset(obj) else "NO"))
          print("names_only=PASS")
          PY
