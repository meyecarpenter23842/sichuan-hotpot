name: Plan and no-auto-deploy guard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  plan-and-vercel-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify original UI references have not changed
        run: node scripts/check-ui-references.mjs
      - name: Verify required docs, skill and immutable Vercel Git gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          required = [
              "AGENTS.md", "docs/plan/MASTER-PLAN.md",
              "docs/ops/DEPLOYMENT-RUNBOOK.md", "docs/ops/INCIDENT-READONLY.md",
              "docs/qa/FRONTEND-QA.md",
              ".agents/skills/professional-frontend-qa/SKILL.md",
          ]
          for path in required:
              p = Path(path)
              assert p.is_file() and p.stat().st_size > 200, path
          for name in ("customer", "admin", "retail", "menu"):
              p = Path(f"apps/{name}/vercel.json")
              config = json.loads(p.read_text(encoding="utf-8"))
              assert config.get("git", {}).get("deploymentEnabled") is False, str(p)
          assert json.loads(Path("vercel.json").read_text(encoding="utf-8")).get("git", {}).get("deploymentEnabled") is False, "root vercel.json"
          plan = Path("docs/plan/MASTER-PLAN.md").read_text(encoding="utf-8")
          assert all(x in plan for x in ("P0", "P1", "P2", "P3", "P4", "P5", "P6"))
          print("Docs, bundled QA skill and Vercel Git-deploy locks: PASS")
          PY

      - name: Verify manual operations workflows and zero auto deploy
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet 'PyYAML==6.0.2'
          python3 - <<'PY'
          import re
          from pathlib import Path
          import yaml
          root=Path(".github/workflows")
          manual=[
            "vps-audit-readonly.yml",
            "vps-api-release-manual.yml",
            "vps-db-backup-manual.yml",
            "vps-db-migrate-manual.yml",
            "vercel-pwa-release-manual.yml",
          ]
          for name in manual:
              content=(root/name).read_text(encoding="utf-8")
              doc=yaml.load(content, Loader=yaml.BaseLoader)
              assert isinstance(doc,dict),name
              events=list(doc.get("on",{}))
              if name in ("vps-api-release-manual.yml","vercel-pwa-release-manual.yml"):
                  assert events == ["workflow_dispatch", "issue_comment"], name
                  assert "github.event.issue.number == 3" in content,name
                  assert "github.event.issue.pull_request == null" in content,name
                  assert "github.actor == 'meyecarpenter23842'" in content,name
                  if name == "vps-api-release-manual.yml":
                      assert "github.event.comment.body == '/deploy-hotpot'" in content,name
                  else:
                      for command in ("/deploy-hotpot-customer", "/deploy-hotpot-admin"):
                          assert f"github.event.comment.body == '{command}'" in content,name
                      assert "production-customer-pwa" in content and "production-admin-pwa" in content,name
                      assert "VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}" in content,name
                      assert "OWNER_COMMAND: ${{ github.event.comment.body }}" in content,name
                      assert 'ref: main' in content,name
              else:
                  assert events == ["workflow_dispatch"], name
              assert doc.get("permissions",{}).get("contents")=="read",name
              jobs=doc.get("jobs",{})
              assert len(jobs)==1,name
              job=next(iter(jobs.values()))
              # Jobs skipped by unrelated issue comments must not reserve or cancel
              # the shared production VPS slot. Keep root locks on unrelated jobs.
              if name in ("vps-api-release-manual.yml","vps-db-backup-manual.yml",
                          "vps-db-migrate-manual.yml"):
                  assert "concurrency" not in doc,name
                  concurrency=job.get("concurrency",{})
                  assert concurrency.get("group")=="hotpot-production-vps-change",name
              else:
                  concurrency=doc.get("concurrency",{})
              assert concurrency.get("cancel-in-progress")=="false",name
              assert job.get("environment"),"Environment-scoped credentials must remain available: "+name
              if name != "vps-audit-readonly.yml":
                  assert "github.actor == 'meyecarpenter23842'" in job.get("if",""),name
              assert "refs/heads/main" in job.get("if",""),name
              assert "StrictHostKeyChecking=yes" in content or "vercel" in name,name
              assert "HOTPOT_RELEASES_ENABLED" in content or "audit" in name,name
              assert not re.search(r"(?m)^  (push|pull_request|schedule):",content),name
              assert "ssh-keyscan -T" not in content,name
              assert "127.0.0.1" not in content or "audit" in name,name
              print("PASS",name,"explicit-owner-or-dispatch-only")
          # DB workflow also accepts only exact owner-issued operational commands.
          db=(root/"vps-db-manual.yml").read_text(encoding="utf-8")
          db_doc=yaml.load(db,Loader=yaml.BaseLoader)
          assert list(db_doc.get("on",{})) == ["workflow_dispatch", "issue_comment"]
          assert "github.event.issue.number == 3" in db
          assert "github.actor == 'meyecarpenter23842'" in db
          assert "github.event.comment.body == '/backup-hotpot'" in db
          assert "github.event.comment.body == '/migrate-hotpot'" in db
          assert "environment: production-api" in db
          assert "github.actor == 'meyecarpenter23842'" in db
          assert "StrictHostKeyChecking=yes" in db
          assert not re.search(r"(?m)^  (push|pull_request|schedule):",db)
          # Dine-in Retail/Menu owner-only Vercel release uses independent Environments.
          dinein=(root/"vercel-dinein-release-manual.yml").read_text(encoding="utf-8")
          dinein_doc=yaml.load(dinein, Loader=yaml.BaseLoader)
          assert list(dinein_doc.get("on",{})) == ["workflow_dispatch","issue_comment"]
          assert dinein_doc.get("permissions",{}).get("contents") == "read"
          assert len(dinein_doc.get("jobs",{})) == 1
          dinein_job=dinein_doc["jobs"]["release"]
          assert "github.actor == 'meyecarpenter23842'" in dinein_job.get("if","")
          assert "github.event.issue.number == 3" in dinein_job.get("if","")
          assert "github.event.issue.pull_request == null" in dinein_job.get("if","")
          for cmd in ("/deploy-hotpot-retail","/deploy-hotpot-menu"):
              assert "github.event.comment.body == '"+cmd+"'" in dinein
          for environment in ("production-retail-pwa","production-menu-pwa"):
              assert environment in dinein
          assert "ref: main" in dinein
          assert "HOTPOT_RELEASES_ENABLED" in dinein
          assert "VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}" in dinein
          assert "deploymentEnabled" in dinein
          assert dinein_doc["concurrency"]["cancel-in-progress"] is False or dinein_doc["concurrency"]["cancel-in-progress"] == "false"
          assert not re.search(r"(?m)^  (push|pull_request|schedule):",dinein)
          print("PASS vercel-dinein-release-manual.yml owner command, isolated targets, zero auto deploy")
          assert Path("docs/ops/MANUAL-OPERATIONS.md").is_file()
          PY

      - name: Verify Dine-in prebuilt routing cannot leak preview host or enable auto deployments
        run: node --test scripts/qa/create-dinein-output-config.test.mjs
