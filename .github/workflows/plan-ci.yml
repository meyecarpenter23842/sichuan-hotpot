name: Plan and no-auto-deploy guard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  plan-and-vercel-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify original UI references have not changed
        run: node scripts/check-ui-references.mjs
      - name: Verify required docs, skill and immutable Vercel Git gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          required = [
              "AGENTS.md", "docs/plan/MASTER-PLAN.md",
              "docs/ops/DEPLOYMENT-RUNBOOK.md", "docs/ops/INCIDENT-READONLY.md",
              "docs/qa/FRONTEND-QA.md",
              ".agents/skills/professional-frontend-qa/SKILL.md",
          ]
          for path in required:
              p = Path(path)
              assert p.is_file() and p.stat().st_size > 200, path
          for name in ("customer", "admin"):
              p = Path(f"apps/{name}/vercel.json")
              config = json.loads(p.read_text(encoding="utf-8"))
              assert config.get("git", {}).get("deploymentEnabled") is False, str(p)
          assert json.loads(Path("vercel.json").read_text(encoding="utf-8")).get("git", {}).get("deploymentEnabled") is False, "root vercel.json"
          plan = Path("docs/plan/MASTER-PLAN.md").read_text(encoding="utf-8")
          assert all(x in plan for x in ("P0", "P1", "P2", "P3", "P4", "P5", "P6"))
          print("Docs, bundled QA skill and Vercel Git-deploy locks: PASS")
          PY

      - name: Verify manual operations workflows and zero auto deploy
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet 'PyYAML==6.0.2'
          python3 - <<'PY'
          import re
          from pathlib import Path
          import yaml
          root=Path(".github/workflows")
          manual=[
            "vps-audit-readonly.yml",
            "vps-api-release-manual.yml",
            "vps-db-backup-manual.yml",
            "vps-db-migrate-manual.yml",
            "vercel-pwa-release-manual.yml",
          ]
          for name in manual:
              content=(root/name).read_text(encoding="utf-8")
              doc=yaml.load(content, Loader=yaml.BaseLoader)
              assert isinstance(doc,dict),name
              assert list(doc.get("on",{}))==["workflow_dispatch"],name
              assert doc.get("permissions",{}).get("contents")=="read",name
              assert doc.get("concurrency",{}).get("cancel-in-progress")=="false",name
              jobs=doc.get("jobs",{})
              assert len(jobs)==1,name
              job=next(iter(jobs.values()))
              assert job.get("environment"),name
              assert "refs/heads/main" in job.get("if",""),name
              assert "StrictHostKeyChecking=yes" in content or "vercel" in name,name
              assert "HOTPOT_RELEASES_ENABLED" in content or "audit" in name,name
              assert not re.search(r"(?m)^  (push|pull_request|issue_comment|schedule):",content),name
              assert "ssh-keyscan -T" not in content,name
              assert "127.0.0.1" not in content or "audit" in name,name
              print("PASS",name,"dispatch-only")
          assert Path("docs/ops/MANUAL-OPERATIONS.md").is_file()
          PY
