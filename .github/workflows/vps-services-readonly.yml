name: Production R2 and road-routing config audit (owner read-only)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  services-audit:
    if: >-
      github.event.issue.number == 3 &&
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/audit-hotpot-services' &&
      github.actor == 'meyecarpenter23842'
    runs-on: ubuntu-latest
    environment: production-api
    timeout-minutes: 7
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Inspect key presence and DNS only; never expose secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$VPS_USER" = ubuntu
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          (( VPS_PORT >= 1 && VPS_PORT <= 65535 ))
          test -n "$VPS_HOST" && test -n "$VPS_KNOWN_HOSTS" && test -n "$VPS_DEPLOY_SSH_KEY"
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "::add-mask::$VPS_HOST"
          umask 077
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/key" >/dev/null
          ssh -T -p "$VPS_PORT" -i "$RUNNER_TEMP/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" 'sudo -n /usr/bin/python3 -' \
            < infra/vps/hotpot-services-audit.py > "$RUNNER_TEMP/status.txt" 2>/dev/null || {
              echo "::error::Service audit blocked. Production unchanged."
              exit 1
            }
          python3 - "$RUNNER_TEMP/status.txt" <<'PY'
          import re,sys
          expected = ("api_env", "r2_account_id", "r2_access_key_id",
                      "r2_secret_access_key", "r2_bucket", "google_routes_api_key",
                      "r2_dns", "routes_dns")
          statuses = {}
          for line in open(sys.argv[1], encoding="utf8"):
              key,sep,value = line.strip().partition("=")
              if not sep or key not in expected or key in statuses or not re.fullmatch(
                r"[A-Z_]{1,32}", value):
                  raise SystemExit("Invalid remote summary; output withheld.")
              statuses[key]=value
          if set(statuses)!=set(expected):
              raise SystemExit("Incomplete remote summary; output withheld.")
          for name in expected:
              print(name+"="+statuses[name])
          PY
      - name: Remove ephemeral SSH files
        if: always()
        run: rm -f "$RUNNER_TEMP/key" "$RUNNER_TEMP/known_hosts" "$RUNNER_TEMP/status.txt"
