name: P1 temporary npm lockfile resolution
on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - apps/api/package.json
      - .github/workflows/p1-lockfile-bootstrap.yml
permissions:
  contents: read
jobs:
  generate-lockfile:
    if: github.head_ref == 'feat/p1-nest-api-health'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve dependency lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit verifiable lockfile contents in short log records
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const content = fs.readFileSync('package-lock.json', 'utf8');
          const parts = Math.ceil(content.length / 4000);
          console.log('HOT_POT_LOCKFILE_PARTS=' + parts);
          for (let i = 0; i < parts; i++) {
            console.log('HOT_POT_LOCKFILE_' + i + '=' + JSON.stringify(content.slice(i * 4000, (i + 1) * 4000)));
          }
          JS
