name: VPS Prisma migration (manual only)
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact current main SHA (40 characters)"
        required: true
        type: string
      backup_id:
        description: "Verified offsite backup ID"
        required: true
        type: string
      restore_proof:
        description: "Isolated restore rehearsal proof ID"
        required: true
        type: string
      confirm:
        description: "Type MIGRATE_DB"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hotpot-production-vps-change
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && github.actor == 'meyecarpenter23842'
    # Repo-scoped secrets; owner-only manual trigger, no reviewer.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENABLE_RELEASES: ${{ vars.HOTPOT_RELEASES_ENABLED }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_DB_MAINTENANCE_SSH_KEY: ${{ secrets.VPS_DB_MAINTENANCE_SSH_KEY }}
      REQUESTED_SHA: ${{ inputs.sha }}
      BACKUP_ID: ${{ inputs.backup_id }}
      RESTORE_PROOF: ${{ inputs.restore_proof }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require actual production restore evidence and exact main SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$ENABLE_RELEASES" = true || { echo "::error::Production DB migration locked."; exit 1; }
          test "$CONFIRM" = MIGRATE_DB
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BACKUP_ID" =~ ^[A-Za-z0-9_.-]{6,100}$ ]]
          [[ "$RESTORE_PROOF" =~ ^[A-Za-z0-9_.-]{6,100}$ ]]
          git fetch -q origin main
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"
          test -d apps/api/prisma/migrations || { echo "::error::Prisma migrations not bootstrapped."; exit 1; }
          test "$VPS_USER" = ubuntu
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          (( VPS_PORT >= 1 && VPS_PORT <= 65535 ))
          test -n "$VPS_HOST" && test -n "$VPS_KNOWN_HOSTS" && test -n "$VPS_DB_MAINTENANCE_SSH_KEY"
          echo "::add-mask::$VPS_HOST"
      - name: Run pre-provisioned migration executor only after evidence verification
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$VPS_DB_MAINTENANCE_SSH_KEY" > "$RUNNER_TEMP/db.key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/db.key" "$RUNNER_TEMP/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/db.key" >/dev/null
          ssh-keygen -l -f "$RUNNER_TEMP/known_hosts" >/dev/null
          # Helper MUST independently verify backup_id and restore_proof against
          # private immutable records, acquire DB advisory lock and run only reviewed migration SHA.
          ssh -T -p "$VPS_PORT" -i "$RUNNER_TEMP/db.key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "test -x /usr/local/sbin/hotpot-db-migrate-manual && /usr/local/sbin/hotpot-db-migrate-manual '$REQUESTED_SHA' '$BACKUP_ID' '$RESTORE_PROOF'" \
            >"$RUNNER_TEMP/migrate.out" 2>"$RUNNER_TEMP/migrate.err" || {
              echo "::error::Migration helper missing or failed; raw output withheld."; exit 1;
            }
          echo "Migration helper returned success; operator must validate Prisma schema and application reads/writes."
