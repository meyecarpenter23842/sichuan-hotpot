name: P0 workspace quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  workspace-quality:
    # The encrypted backup drill needs native PostgreSQL 16 client tools.
    # Do not silently track ubuntu-latest (26.04 omits postgresql-client-16).
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotpot_ci
          POSTGRES_USER: hotpot_ci
          POSTGRES_PASSWORD: hotpot_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotpot_ci -d hotpot_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hotpot_ci:hotpot_ci_only@127.0.0.1:5432/hotpot_ci?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact workspace lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Prisma schema and generate client
        run: |
          npm run prisma:validate
          npm run prisma:generate
      - name: Apply migrations to disposable CI Postgres
        run: |
          prisma_status=0
          npm exec -- prisma migrate deploy --schema apps/api/prisma/schema.prisma || prisma_status=$?
          exit "$prisma_status"
      - name: Assert migrated PostgreSQL matches schema
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- prisma migrate status --schema apps/api/prisma/schema.prisma
          npm exec -- prisma migrate diff --from-schema-datasource apps/api/prisma/schema.prisma --to-schema-datamodel apps/api/prisma/schema.prisma --exit-code
      - name: Assert Dine-in L01 database invariants on disposable CI Postgres
        run: node scripts/qa/dining-db-invariants.mjs
      - name: Validate source and auto-deploy lock
        run: npm run lint
      - name: TypeScript strict check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Assert L02 Dining API invariants on disposable CI Postgres
        run: node scripts/qa/dining-api-invariants.mjs
      - name: Build shared package
        run: npm run build
      - name: Check customer Expo source (P2)
        run: |
          npm run lint --workspace @hotpot/customer
          npm run typecheck --workspace @hotpot/customer
          npm run test --workspace @hotpot/customer
      - name: Build customer Expo Web (iPhone PWA)
        run: |
          npm run build --workspace @hotpot/customer
          test -f apps/customer/dist/index.html
      - name: Check independent Admin Expo source (P4.1)
        run: |
          npm run lint --workspace @hotpot/admin
          npm run typecheck --workspace @hotpot/admin
          npm run test --workspace @hotpot/admin
      - name: Build Admin Expo Web (PWA)
        run: |
          npm run build --workspace @hotpot/admin
          test -s apps/admin/dist/index.html
      - name: Check Dine-in Retail and Menu Expo source
        run: |
          for app in retail menu; do
            npm run lint --workspace "@hotpot/$app"
            npm run typecheck --workspace "@hotpot/$app"
            npm run test --workspace "@hotpot/$app"
          done
      - name: Build Dine-in Retail and Menu Expo Web
        run: |
          for app in retail menu; do
            npm run build --workspace "@hotpot/$app"
            test -s "apps/$app/dist/index.html"
          done
      - name: P2.1 browser auth QA against disposable NestJS/Postgres
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
          npx playwright install --with-deps chromium
          # Unit tests may leave disposable branch fixtures; first-store QA needs a blank DB.
          # NEVER allow this CI-only reset to operate on a non-CI or remote database.
          test "$DATABASE_URL" = "postgresql://hotpot_ci:hotpot_ci_only@127.0.0.1:5432/hotpot_ci?schema=public" || {
            echo "::error::Refusing CI QA database reset outside dedicated localhost hotpot_ci."
            exit 1
          }
          npm exec -- prisma migrate reset --force --skip-seed --schema apps/api/prisma/schema.prisma
          export AUTH_JWT_SECRET="$(openssl rand -hex 40)"
          export CORS_ALLOWED_ORIGINS="http://127.0.0.1:3000,http://127.0.0.1:3002"
          # Disposable local Resend-compatible mail endpoint, never production.
          node scripts/qa/email-sandbox.mjs > /tmp/hotpot-ci-email-sandbox.log 2>&1 &
          mail_pid=$!
          export NODE_ENV=test RESEND_API_KEY=ci_dummy_key HOTPOT_MAIL_FROM=noreply@ci.example.test
          export RESEND_TEST_API_URL=http://127.0.0.1:3333/emails
          PORT=3001 HOST=127.0.0.1 node apps/api/dist/main.js > /tmp/hotpot-ci-p21-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" "${web_pid:-0}" "${mail_pid:-0}" "${admin_pid:-0}" 2>/dev/null || true' EXIT
          # The standard quality step already exported without API config.
          # Clear Metro's transform cache so EXPO_PUBLIC_API_BASE_URL is embedded.
          ( cd apps/customer && EXPO_PUBLIC_API_BASE_URL="http://127.0.0.1:3001" npx expo export --platform web --output-dir dist --clear && node scripts/lock-pwa-viewport.mjs )
          grep -Rq "127.0.0.1:3001" apps/customer/dist/_expo/static/js/web/ || {
            echo "::error::QA web bundle lacks the disposable test API base URL"
            exit 1
          }
          node scripts/qa/pwa-cookie-proxy.mjs > /tmp/hotpot-ci-p21-web.log 2>&1 &
          web_pid=$!
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3001/health/live >/dev/null &&
               curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          ( cd apps/admin && EXPO_PUBLIC_API_BASE_URL="http://127.0.0.1:3001" npx expo export --platform web --output-dir dist --clear )
          HOTPOT_QA_PWA_APP=admin HOTPOT_QA_WEB_PORT=3002 \
            node scripts/qa/pwa-cookie-proxy.mjs > /tmp/hotpot-ci-p41-admin-web.log 2>&1 &
          admin_pid=$!
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3002/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa/p42-first-branch-browser-qa.mjs
          node scripts/qa/p21-login-browser-qa.mjs
          node scripts/qa/p22-catalog-browser-qa.mjs
          node scripts/qa/p24-home-browser-qa.mjs
          node scripts/qa/p25-address-layout-browser-qa.mjs
          node scripts/qa/p43-customer-account-browser-qa.mjs
          # Separate QA suites so the production-equivalent 8/min login limiter
          # remains enforced, rather than leaking test logins between suites.
          kill "$api_pid"
          wait "$api_pid" 2>/dev/null || true
          PORT=3001 HOST=127.0.0.1 node apps/api/dist/main.js > /tmp/hotpot-ci-p41-api.log 2>&1 &
          api_pid=$!
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3001/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3001/health/ready >/dev/null
          node scripts/qa/p41-admin-browser-qa.mjs
          node scripts/qa/p44-image-optimizer-browser-qa.mjs
      - name: Archive P2.1 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-browser-qa-screenshots
          path: apps/customer/qa-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive P4.1 Admin browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-browser-qa-screenshots
          path: apps/admin/qa-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate manual release safety and rollback without services
        run: |
          python3 -m py_compile infra/vps/*.py
          python3 -m unittest discover -s infra/vps/tests -v
      - name: Exercise encrypted backup, isolated restore and approved migration on disposable CI only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age postgresql-client-16
          psql --version | grep -Eq '^psql \(PostgreSQL\) 16\.'
          pg_dump --version | grep -Eq '^pg_dump \(PostgreSQL\) 16\.'
          pg_restore --version | grep -Eq '^pg_restore \(PostgreSQL\) 16\.'
          export CI_NODE_BIN="$(command -v node)" CI_NPM_BIN="$(command -v npm)"
          sudo --preserve-env=DATABASE_URL,GITHUB_ACTIONS,CI_NODE_BIN,CI_NPM_BIN python3 infra/vps/tests/ci_db_drill.py
