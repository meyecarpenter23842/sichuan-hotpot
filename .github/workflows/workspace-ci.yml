name: P0 workspace quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  workspace-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact workspace lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate source and auto-deploy lock
        run: npm run lint
      - name: TypeScript strict check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build shared package
        run: npm run build
