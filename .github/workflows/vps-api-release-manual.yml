name: VPS API release (one command, owner only)
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact current main commit (40-char SHA)"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY_API"
        required: true
        type: string
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  api:
    concurrency:
      group: hotpot-production-vps-change
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'meyecarpenter23842') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 3 &&
       github.event.issue.pull_request == null &&
       github.event.comment.body == '/deploy-hotpot' &&
       github.actor == 'meyecarpenter23842')
    # Reuse existing environment-scoped production credentials and variables.
    # Turn off Required reviewers ONCE, never move SSH secrets into source.
    environment: production-api
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Isolated disposable CI database for PR-equivalent integration checks;
    # no production DATABASE_URL is exposed to this job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotpot_api_release_check
          POSTGRES_USER: hotpot_release_check
          POSTGRES_PASSWORD: test_only_never_production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotpot_release_check -d hotpot_api_release_check"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hotpot_release_check:test_only_never_production@localhost:5432/hotpot_api_release_check?schema=public
      ENABLE_RELEASES: ${{ vars.HOTPOT_RELEASES_ENABLED }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
      REQUESTED_SHA: ${{ inputs.sha }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Guard exact SHA, pre-provisioned API runtime, and explicit release enablement
        shell: bash
        run: |
          set -euo pipefail
          # One explicit owner issue command replaces repeated SHA/confirmation inputs.
          # The VPS helper still enforces real HTTPS, schema readiness and rollback.
          if [[ "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            REQUESTED_SHA="$(git rev-parse HEAD)"
          else
            test "$ENABLE_RELEASES" = true || { echo "::error::API release disabled until bootstrap."; exit 1; }
            test "$CONFIRM" = DEPLOY_API
          fi
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch -q origin main
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"
          echo "REQUESTED_SHA=$REQUESTED_SHA" >> "$GITHUB_ENV"
          test -f apps/api/package.json && test -f package-lock.json || { echo "::error::NestJS app not bootstrapped."; exit 1; }
          test "$VPS_USER" = ubuntu
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          (( VPS_PORT >= 1 && VPS_PORT <= 65535 ))
          test -n "$VPS_HOST" && test -n "$VPS_KNOWN_HOSTS" && test -n "$VPS_DEPLOY_SSH_KEY"
          echo "::add-mask::$VPS_HOST"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate Prisma, run full workspace tests and compile API
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prisma:validate
          npm run prisma:generate
          # Never run migrations against production in the API workflow.
          npm exec -- prisma migrate deploy --schema apps/api/prisma/schema.prisma
          npm exec -- prisma migrate status --schema apps/api/prisma/schema.prisma
          npm exec -- prisma migrate diff --from-schema-datasource apps/api/prisma/schema.prisma --to-schema-datamodel apps/api/prisma/schema.prisma --exit-code
          npm run lint
          npm run typecheck
          npm test
          npm run build
          test -f apps/api/dist/main.js
      - name: Create source-identified runtime archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          # Explicit runtime inputs only. Never archive workspace node_modules,
          # local environment files, frontend code or arbitrary package files.
          tar -czf "$RUNNER_TEMP/hotpot-api-$REQUESTED_SHA.tgz" \
            package.json package-lock.json \
            apps/api/package.json apps/api/dist \
            apps/api/prisma/schema.prisma apps/api/prisma/migrations \
            apps/customer/package.json apps/admin/package.json \
            packages/shared/package.json packages/shared/dist packages/ui/package.json
          sha256sum "$RUNNER_TEMP/hotpot-api-$REQUESTED_SHA.tgz" | awk '{print $1}' > "$RUNNER_TEMP/api.sha256"
      - name: Verified artifact, live generic backup/migration, then API activation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy.key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy.key" "$RUNNER_TEMP/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/deploy.key" >/dev/null
          ssh-keygen -l -f "$RUNNER_TEMP/known_hosts" >/dev/null
          # Host must have an independently reviewed hotpot-api-release-manual helper.
          # The helper must validate artifact checksum, app path, service identity, health and rollback.
          ssh_options=(-p "$VPS_PORT" -i "$RUNNER_TEMP/deploy.key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=10)
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            'test -x /usr/local/sbin/hotpot-api-release-manual && test -d /opt/sichuan-hotpot/incoming' \
            >/dev/null 2>/dev/null || { echo "::error::VPS manual release hook/inbox not provisioned."; exit 1; }
          # SFTP/scp can be disabled on the hardened VPS. Stream through the
          # pinned SSH command channel to an unprivileged, unique temporary file.
          # Never write directly to the protected inbox as the deploy SSH user.
          digest="$(cat "$RUNNER_TEMP/api.sha256")"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          remote_tmp="/home/ubuntu/.hotpot-api-$REQUESTED_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tgz"
          ssh -T "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            "umask 077 && test ! -e '$remote_tmp' && cat > '$remote_tmp'" \
            < "$RUNNER_TEMP/hotpot-api-$REQUESTED_SHA.tgz" >/dev/null 2>/dev/null || {
              echo "::error::VPS artifact stream failed; API unchanged."; exit 1;
            }
          actual="$(ssh -T "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            "sha256sum '$remote_tmp'" 2>/dev/null | awk '{print $1}')" || {
              echo "::error::VPS staging checksum unavailable; API unchanged."; exit 1;
            }
          test "$actual" = "$digest" || {
            echo "::error::VPS staging checksum mismatch; API unchanged."; exit 1;
          }
          # Update only an explicitly recognized reviewed release helper.
          expected_previous="$(git show 86239ea349493bd3a5d2e7c1ef61ea16f3c5b8d9:infra/vps/hotpot-api-release-manual.py | sha256sum | awk '{print $1}')"
          expected_p42="$(git show 28d7ef62d0d1da4a8fd84f21f0f8c713488968a0:infra/vps/hotpot-api-release-manual.py | sha256sum | awk '{print $1}')"
          expected_helper="$(sha256sum infra/vps/hotpot-api-release-manual.py | awk '{print $1}')"
          actual_helper="$(ssh -T "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            'sudo -n sha256sum /usr/local/sbin/hotpot-api-release-manual' 2>/dev/null | awk '{print $1}')" || exit 1
          if [[ "$actual_helper" != "$expected_previous" && "$actual_helper" != "$expected_p42" && "$actual_helper" != "$expected_helper" ]]; then
            echo "::error::Unknown VPS release helper; stopping before migration."
            exit 1
          fi
          if [[ "$actual_helper" != "$expected_helper" ]]; then
            helper_tmp="/home/ubuntu/.hotpot-helper-$REQUESTED_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.py"
            ssh -T "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
              "umask 077 && test ! -e '$helper_tmp' && cat > '$helper_tmp'" \
              < infra/vps/hotpot-api-release-manual.py >/dev/null 2>/dev/null || exit 1
            helper_digest="$(ssh -T "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
              "sha256sum '$helper_tmp'" 2>/dev/null | awk '{print $1}')"
            test "$helper_digest" = "$expected_helper" || exit 1
            ssh -T "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
              "sudo -n install -o root -g root -m 0755 '$helper_tmp' /usr/local/sbin/hotpot-api-release-manual && rm -f '$helper_tmp'" \
              >/dev/null 2>/dev/null || exit 1
            actual_helper="$(ssh -T "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
              'sudo -n sha256sum /usr/local/sbin/hotpot-api-release-manual' 2>/dev/null | awk '{print $1}')"
          fi
          test "$expected_helper" = "$actual_helper" || {
            echo "::error::Installed VPS release helper is not protected main; API unchanged."; exit 1;
          }
          ssh -T "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            "sudo -n install -o root -g root -m 0600 '$remote_tmp' '/opt/sichuan-hotpot/incoming/hotpot-api-$REQUESTED_SHA.tgz' && rm -f '$remote_tmp'" \
            >/dev/null 2>/dev/null || {
              echo "::error::Protected artifact staging failed; API unchanged."; exit 1;
            }
          verify="$(ssh -T "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/hotpot-api-release-manual --verify-archive '$REQUESTED_SHA' '$digest'" 2>&1)" || {
              echo "::error::Protected release archive validation failed; API unchanged."; exit 1;
            }
          grep -Fqx 'archive_validation=PASS' <<< "$verify" || exit 1
          # Any pending reviewed migration requires encrypted R2 backup and isolated restore.
          p42_check="$(ssh -T "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/bin/python3 - --check '$REQUESTED_SHA' '$digest'" \
            < infra/vps/hotpot-p42-operations.py 2>&1)" || {
              reason="$(printf '%s\n' "$p42_check" | sed -n 's/^p42_operation=BLOCKED;reason=\([a-z_]*\)$/\1/p' | tail -n 1)"
              echo "::error::Migration preflight blocked: $reason"
              exit 1
            }
          grep -Fq 'p42_preflight=PASS;' <<< "$p42_check" || exit 1
          p42_result="$(ssh -T "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/bin/python3 - --release '$REQUESTED_SHA' '$digest'" \
            < infra/vps/hotpot-p42-operations.py 2>&1)" || {
              reason="$(printf '%s\n' "$p42_result" | sed -n 's/^p42_operation=BLOCKED;reason=\([a-z_]*\)$/\1/p' | tail -n 1)"
              echo "::error::Migration R2 backup/restore blocked: $reason; API unchanged."
              exit 1
            }
          if grep -Fqx 'p42_database_ready=PASS' <<< "$p42_result"; then
            echo "R2 encrypted backup, isolated restore, live migration: PASS"
          elif grep -Fqx 'migration=ALREADY_APPLIED' <<< "$p42_result"; then
            echo "Verified schema already applied: PASS"
          else
            echo "::error::No verified migration result."
            exit 1
          fi
          git fetch -q origin main
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"
          outcome="$(ssh -T "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/hotpot-api-release-manual '$REQUESTED_SHA' '$digest'" 2>&1)" || {
              reason="$(printf '%s\n' "$outcome" | sed -n 's/^release_error=\([a-z_]*\)$/\1/p' | tail -n 1)"
              echo "::error::API release blocked: ${reason:-unknown}; check VPS health/rollback."
              exit 1
            }
          grep -Fqx 'health_live=PASS;health_ready=PASS' <<< "$outcome" || {
            echo "::error::Backend helper did not confirm live and ready."; exit 1;
          }
          grep -Fqx "release_sha=$REQUESTED_SHA" <<< "$outcome" || {
            echo "::error::Backend helper did not confirm requested SHA."; exit 1;
          }
          echo "VPS API release, exact SHA, live and ready: PASS"
      - name: Enable and verify HTTPS WebSocket Upgrade with rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-p "$VPS_PORT" -i "$RUNNER_TEMP/deploy.key"
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=10)
          result="$(ssh -T "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" 'sudo -n /usr/bin/python3 -' < infra/vps/hotpot-realtime-nginx.py)" || {
            if [[ "$result" =~ ^realtime_https_upgrade=BLOCKED\;reason=([a-z_]+)$ ]]; then
              echo "::error::Realtime proxy gate: ${BASH_REMATCH[1]}"
            else
              echo "::error::Realtime proxy gate: unknown"
            fi
            exit 1
          }
          grep -Eq '^realtime_https_upgrade=(PASS|ALREADY_READY)$' <<< "$result" || exit 1
          echo "Authenticated realtime HTTPS upgrade: PASS"
      - name: Remove temporary SSH credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/deploy.key" "$RUNNER_TEMP/known_hosts"
