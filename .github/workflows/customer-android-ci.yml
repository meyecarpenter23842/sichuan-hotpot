name: Customer Android native build

on:
  pull_request:
    paths:
      - "apps/customer/**"
      - "package-lock.json"
      - ".github/workflows/customer-android-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/customer/**"
      - "package-lock.json"
      - ".github/workflows/customer-android-ci.yml"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      EXPO_NO_DOTENV: "1"
      EXPO_PUBLIC_API_BASE_URL: "https://api-ci.invalid"
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: "ci-web.apps.googleusercontent.com"
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: "ci-android.apps.googleusercontent.com"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install exact workspace lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate customer icon assets
        run: npm run icons:generate --workspace @hotpot/customer

      - name: Prove local prebuild needs no Firebase descriptor
        shell: bash
        run: |
          set -euo pipefail
          test ! -e apps/customer/google-services.json

      - name: Clean Expo prebuild for Android without Firebase descriptor
        run: npm run android:prebuild --workspace @hotpot/customer

      - name: Prove Metro root is pinned to the app directory
        shell: bash
        run: |
          set -euo pipefail
          gradle_file="apps/customer/android/app/build.gradle"
          test -s "$gradle_file"
          grep -Fq 'root = new File(projectRoot)' "$gradle_file"
          echo "Metro app project root pin: PASS"

      - name: Assert generated Android app schemes
        shell: bash
        run: |
          set -euo pipefail
          manifest="apps/customer/android/app/src/main/AndroidManifest.xml"
          test -s "$manifest"
          grep -Fq 'android:scheme="sichuanhotpot"' "$manifest"
          grep -Fq 'android:scheme="vn.sichuanhotpot.customer"' "$manifest"
          echo "Android OAuth callback schemes: PASS"

      - name: Assert generated native project has no Google Maps SDK residue
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/customer/android/app/src/main/AndroidManifest.xml
          if grep -RInE             'com\.google\.android\.geo\.API_KEY|com\.google\.android\.gms\.maps|play-services-maps|react-native-maps'             apps/customer/android; then
            echo "::error::Generated Android project still contains Google Maps SDK residue."
            exit 1
          fi

      - name: Resolve Android debug runtime dependencies
        working-directory: apps/customer/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon             > "$RUNNER_TEMP/customer-android-debug-dependencies.txt"
          if grep -Ei 'com\.google\.android\.gms:play-services-maps|react-native-maps'             "$RUNNER_TEMP/customer-android-debug-dependencies.txt"; then
            echo "::error::Android runtime dependency graph still contains Google Maps."
            exit 1
          fi
          if ! grep -Eiq 'com\.google\.android\.gms:play-services-auth|google-signin'             "$RUNNER_TEMP/customer-android-debug-dependencies.txt"; then
            echo "::error::Native Google Sign-In SDK is missing from Android runtime dependencies."
            exit 1
          fi
          echo "Native Google Sign-In dependency: PASS"

      - name: Build customer debug APK
        working-directory: apps/customer/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build customer release-equivalent APK
        working-directory: apps/customer/android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Archive Android dependency proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-android-debug-dependencies
          path: ${{ runner.temp }}/customer-android-debug-dependencies.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Archive customer debug APK
        uses: actions/upload-artifact@v4
        with:
          name: customer-android-debug-apk
          path: apps/customer/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Archive customer release-equivalent APK
        uses: actions/upload-artifact@v4
        with:
          name: customer-android-release-equivalent-apk
          path: apps/customer/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
