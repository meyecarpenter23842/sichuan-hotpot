name: Set up first OWNER on VPS (owner command only)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  owner:
    concurrency:
      group: hotpot-production-vps-change
      cancel-in-progress: false
    if: >-
      github.event.issue.number == 3 &&
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/bootstrap-hotpot-owner' &&
      github.actor == 'meyecarpenter23842'
    environment: production-api
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate protected main and pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$VPS_USER" = ubuntu
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          (( VPS_PORT >= 1 && VPS_PORT <= 65535 ))
          test -n "$VPS_HOST" && test -n "$VPS_KNOWN_HOSTS" && test -n "$VPS_DEPLOY_SSH_KEY"
          echo "::add-mask::$VPS_HOST"
          python3 -m unittest discover -s infra/vps/tests -p test_owner_ci_setup.py -v
      - name: Bootstrap first OWNER and request Resend password setup OTP
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh.key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh.key" "$RUNNER_TEMP/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/ssh.key" >/dev/null 2>&1
          ssh-keygen -l -f "$RUNNER_TEMP/known_hosts" >/dev/null 2>&1
          opts=(-T -p "$VPS_PORT" -i "$RUNNER_TEMP/ssh.key"
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=10)
          if ! outcome="$(ssh "${opts[@]}" "$VPS_USER@$VPS_HOST" \
              'sudo -n /usr/bin/python3 -' < infra/vps/hotpot-owner-ci-setup.py 2>&1)"; then
            echo "::error::First OWNER setup blocked; no credentials printed."
            printf '%s\n' "$outcome" | grep -E '^owner_setup=BLOCKED;reason=[a-z_]+$' || true
            exit 1
          fi
          grep -Eq '^owner_record=(CREATED|ALREADY_EXISTS)$' <<< "$outcome" || exit 1
          grep -Fqx 'owner_reset_otp=REQUESTED;password_exposed=no' <<< "$outcome" || exit 1
          echo "OWNER record exists; Resend password-setup OTP requested: PASS"
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/ssh.key" "$RUNNER_TEMP/known_hosts"
