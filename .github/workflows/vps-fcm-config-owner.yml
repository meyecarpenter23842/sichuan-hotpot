name: Configure production Firebase FCM (owner only)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  fcm:
    if: >-
      github.event.issue.number == 3 &&
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/configure-hotpot-fcm' &&
      github.actor == 'meyecarpenter23842'
    environment: production-api
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: hotpot-production-vps-change
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
      FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.HOTPOT_FCM_SERVICE_ACCOUNT_JSON || secrets.FCM_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require owner protected main, FCM secret and valid target
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$VPS_USER" = ubuntu
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          (( VPS_PORT >= 1 && VPS_PORT <= 65535 ))
          test -n "$VPS_HOST" && test -n "$VPS_DEPLOY_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS"
          test -n "$FCM_SERVICE_ACCOUNT_JSON" || {
            echo "::error::Missing production-api secret HOTPOT_FCM_SERVICE_ACCOUNT_JSON; nothing changed on VPS."
            exit 1
          }
          python3 -m unittest discover -s infra/vps/tests -p 'test_fcm_config.py' -v
          echo "VPS identity, protected main and Firebase secret: PRESENT (value withheld)"
      - name: Configure FCM through pinned SSH and verify OAuth, API permissions and health
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/fcm.json"
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh.key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/fcm.json" "$RUNNER_TEMP/ssh.key" "$RUNNER_TEMP/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/ssh.key" >/dev/null 2>&1
          ssh_opts=(-T -p "$VPS_PORT" -i "$RUNNER_TEMP/ssh.key"
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=10)
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            'sudo -n /usr/bin/tee /run/hotpot-fcm-config.py >/dev/null && sudo -n /usr/bin/chmod 0700 /run/hotpot-fcm-config.py' \
            < infra/vps/hotpot-fcm-config.py >/dev/null 2>/dev/null || {
              echo "::error::Cannot stage trusted FCM helper; no secrets sent."
              exit 1
            }
          if ! ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
              'sudo -n /usr/bin/python3 /run/hotpot-fcm-config.py' \
              < "$RUNNER_TEMP/fcm.json" > "$RUNNER_TEMP/fcm-result" 2>/dev/null; then
            grep -E '^fcm_configuration=BLOCKED;reason=[a-z_]+$' "$RUNNER_TEMP/fcm-result" || true
            echo "::error::FCM setup blocked; API env unchanged or rolled back."
            exit 1
          fi
          grep -Eq '^fcm_configuration=(APPLIED|ALREADY_READY);provider_auth=PASS;api_live=PASS;api_ready=PASS$' \
            "$RUNNER_TEMP/fcm-result" || {
              echo "::error::FCM verification proof missing."
              exit 1
            }
          echo "Firebase FCM credential authorized; API live and ready: PASS"
      - name: Remove temporary secret files and root helper
        if: always()
        shell: bash
        run: |
          if [[ -n "$VPS_USER" && -n "$VPS_HOST" && -s "$RUNNER_TEMP/ssh.key" && -s "$RUNNER_TEMP/known_hosts" ]]; then
            ssh -T -p "$VPS_PORT" -i "$RUNNER_TEMP/ssh.key" -o IdentitiesOnly=yes \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=10 \
              "$VPS_USER@$VPS_HOST" \
              'sudo -n /usr/bin/rm -f /run/hotpot-fcm-config.py' </dev/null >/dev/null 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/fcm.json" "$RUNNER_TEMP/ssh.key" \
            "$RUNNER_TEMP/known_hosts" "$RUNNER_TEMP/fcm-result"
