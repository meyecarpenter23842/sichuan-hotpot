name: VPS PostgreSQL backup (manual only)
on:
  workflow_dispatch:
    inputs:
      ticket:
        description: "Change ticket (letters, digits, underscore or dash)"
        required: true
        type: string
      confirm:
        description: "Type BACKUP_DB"
        required: true
        type: string
permissions:
  contents: read
jobs:
  backup:
    concurrency:
      group: hotpot-production-vps-change
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.actor == 'meyecarpenter23842'
    environment: production-db
    # Reuse existing environment-scoped VPS backup key and variables.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENABLE_RELEASES: ${{ vars.HOTPOT_RELEASES_ENABLED }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_DB_MAINTENANCE_SSH_KEY: ${{ secrets.VPS_DB_MAINTENANCE_SSH_KEY }}
      TICKET: ${{ inputs.ticket }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Verify protected manual backup approval
        shell: bash
        run: |
          set -euo pipefail
          test "$ENABLE_RELEASES" = true || { echo "::error::Database workflows locked until backup/restore runbook is verified."; exit 1; }
          test "$CONFIRM" = BACKUP_DB
          [[ "$TICKET" =~ ^[a-zA-Z0-9_-]{3,60}$ ]]
          test "$VPS_USER" = ubuntu
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          (( VPS_PORT >= 1 && VPS_PORT <= 65535 ))
          test -n "$VPS_HOST" && test -n "$VPS_KNOWN_HOSTS" && test -n "$VPS_DB_MAINTENANCE_SSH_KEY"
          echo "::add-mask::$VPS_HOST"
      - name: Call approved on-VPS backup helper (no database dump to GitHub)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$VPS_DB_MAINTENANCE_SSH_KEY" > "$RUNNER_TEMP/db.key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/db.key" "$RUNNER_TEMP/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/db.key" >/dev/null
          ssh-keygen -l -f "$RUNNER_TEMP/known_hosts" >/dev/null
          # The separately installed VPS helper must encrypt+offsite backup, checksum,
          # restore-test on isolated DB and record approved backup ID, or exit nonzero.
          ssh -T -p "$VPS_PORT" -i "$RUNNER_TEMP/db.key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "test -x /usr/local/sbin/hotpot-db-backup-manual && /usr/local/sbin/hotpot-db-backup-manual '$TICKET'" \
            >"$RUNNER_TEMP/backup.out" 2>"$RUNNER_TEMP/backup.err" || {
              echo "::error::Backup helper missing or failed; raw output withheld."; exit 1;
            }
          echo "Backup helper succeeded. Verify offsite backup/restore proof privately before migration."
