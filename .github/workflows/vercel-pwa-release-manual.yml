name: Vercel PWA release (owner one-command)
on:
  workflow_dispatch:
    inputs:
      app:
        description: PWA to publish
        required: true
        type: choice
        options: [customer, admin]
      sha:
        description: "Exact 40-character current main SHA"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY_PWA"
        required: true
        type: string
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: hotpot-pwa-${{ github.event_name == 'issue_comment' && (github.event.comment.body == '/deploy-hotpot-customer' && 'customer' || 'admin') || inputs.app }}-production
  cancel-in-progress: false
jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'meyecarpenter23842') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 3 &&
       github.event.issue.pull_request == null &&
       github.actor == 'meyecarpenter23842' &&
       (github.event.comment.body == '/deploy-hotpot-customer' ||
        github.event.comment.body == '/deploy-hotpot-admin'))
    # Select preconfigured per-app Environment for its own token/project ID.
    # Owner disables Required reviewers once on both PWA Environments.
    environment:
      name: ${{ (github.event_name == 'issue_comment' && github.event.comment.body == '/deploy-hotpot-customer' || github.event_name == 'workflow_dispatch' && inputs.app == 'customer') && 'production-customer-pwa' || 'production-admin-pwa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ENABLE_RELEASES: ${{ vars.HOTPOT_RELEASES_ENABLED }}
      TARGET_APP: ${{ github.event_name == 'issue_comment' && (github.event.comment.body == '/deploy-hotpot-customer' && 'customer' || 'admin') || inputs.app }}
      REQUESTED_SHA: ${{ inputs.sha }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Production release gate and immutable source verification
        shell: bash
        env:
          OWNER_COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          # The owner-only Issue #3 command is the single release request.
          # Legacy workflow_dispatch retains its original explicit confirmation.
          if [[ "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            case "$OWNER_COMMAND:$TARGET_APP" in
              /deploy-hotpot-customer:customer|/deploy-hotpot-admin:admin) ;;
              *) echo "::error::Invalid owner command or target."; exit 1 ;;
            esac
            REQUESTED_SHA="$(git rev-parse HEAD)"
          else
            test "$CONFIRM" = "DEPLOY_PWA"
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$ENABLE_RELEASES" = "true" || { echo "::error::Manual PWA release is disabled."; exit 1; }
          fi
          [[ "$TARGET_APP" == customer || "$TARGET_APP" == admin ]]
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch -q origin main
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"
          echo "REQUESTED_SHA=$REQUESTED_SHA" >> "$GITHUB_ENV"
          test -f "apps/$TARGET_APP/package.json" || { echo "::error::Expo app not bootstrapped."; exit 1; }
          test -f package-lock.json || { echo "::error::Monorepo lockfile missing."; exit 1; }
          python3 - "$TARGET_APP" <<'PY'
          import json, pathlib, sys
          for path in ("vercel.json", f"apps/{sys.argv[1]}/vercel.json"):
              assert json.loads(pathlib.Path(path).read_text())["git"]["deploymentEnabled"] is False
          PY
          test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" && test -n "$VERCEL_TOKEN"
      - name: Verify Vercel target identity without changing its settings
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/vercel-target.json"
          curl -fsS --retry 1 -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" > "$response"
          node - "$response" "$TARGET_APP" "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" <<'NODE'
          const fs=require('node:fs');
          const [file,app,id,org]=process.argv.slice(2);
          const p=JSON.parse(fs.readFileSync(file,'utf8'));
          if(p.id!==id || p.accountId!==org || p.name!==('sichuan-hotpot-'+app)
            || p.rootDirectory!==('apps/'+app) || p.link) {
            throw Error('Vercel project identity/root/Git-link mismatch; release blocked');
          }
          console.log('Provider target verified: correct project, root and no Git link');
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies, test target, and pin deployment CLI to the runner
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund 'vercel@50'
          test -x node_modules/.bin/vercel
          npm run lint --workspace "apps/$TARGET_APP"
          npm run typecheck --workspace "apps/$TARGET_APP"
          npm run test --workspace "apps/$TARGET_APP"
      - name: Fetch production settings BEFORE compiling Expo
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "apps/$TARGET_APP/.vercel"
          node -e 'const fs=require("node:fs");fs.writeFileSync(process.argv[1],JSON.stringify({orgId:process.env.VERCEL_ORG_ID,projectId:process.env.VERCEL_PROJECT_ID}))' "apps/$TARGET_APP/.vercel/project.json"
          (
            cd "apps/$TARGET_APP"
            ../../node_modules/.bin/vercel env pull .env.production.local \
              --environment=production --yes --token "$VERCEL_TOKEN" >/dev/null
          )
          if [[ "$TARGET_APP" == customer ]]; then
            python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import os
          path=Path("apps/customer/.env.production.local")
          items=[line.split("=",1)[1].strip().strip("'\"")
                 for line in path.read_text().splitlines()
                 if line.startswith("EXPO_PUBLIC_API_BASE_URL=")]
          if len(items)!=1:
              raise SystemExit("Customer production API base URL missing or duplicated in Vercel")
          url=urlsplit(items[0])
          if url.scheme!="https" or not url.hostname or url.username or url.password or url.query or url.fragment or url.path not in ("","/"):
              raise SystemExit("Customer production API must have a valid HTTPS origin")
          with open(os.environ["GITHUB_ENV"],"a") as out:
              out.write("PWA_API_ORIGIN="+url.geturl().rstrip("/")+"\n")
          print("Vercel production API HTTPS origin loaded: PASS")
          PY
          fi
      - name: Verify public API and customer browser CORS before release
        if: env.TARGET_APP == 'customer'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 8 --max-time 15 \
            -o /dev/null "$PWA_API_ORIGIN/health/ready" || {
            echo "::error::Production API HTTPS /health/ready unavailable; PWA not published."
            exit 1
          }
          curl --fail --silent --show-error --connect-timeout 8 --max-time 15 \
            -X OPTIONS -D "$RUNNER_TEMP/hotpot-cors.txt" -o /dev/null \
            -H 'Origin: https://sichuan-hotpot-customer.vercel.app' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            "$PWA_API_ORIGIN/auth/login" || {
            echo "::error::Production API CORS preflight failed; PWA not published."
            exit 1
          }
          tr -d '\r' < "$RUNNER_TEMP/hotpot-cors.txt" | grep -Eiq '^access-control-allow-origin: https://sichuan-hotpot-customer\.vercel\.app$' || {
            echo "::error::Production API does not allow Customer PWA origin in CORS_ALLOWED_ORIGINS."
            exit 1
          }
          echo "Customer API HTTPS and browser CORS: PASS"
      - name: Compile and inspect selected production Expo Web app
        shell: bash
        run: |
          set -euo pipefail
          npm run build --workspace "apps/$TARGET_APP"
          test -s "apps/$TARGET_APP/dist/index.html"
          if [[ "$TARGET_APP" == customer ]]; then
            grep -FRq "$PWA_API_ORIGIN" "apps/customer/dist/_expo/static/js/web" || {
              echo "::error::Expo bundle did not embed the approved production API URL."
              exit 1
            }
          fi
          echo "Production environment embedded and Expo PWA build: PASS"
      - name: Package exact tested Expo export for Vercel (no remote rebuild)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "apps/$TARGET_APP/.vercel/output/static"
          cp -a "apps/$TARGET_APP/dist/." "apps/$TARGET_APP/.vercel/output/static/"
          printf '%s\n' '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}' \
            > "apps/$TARGET_APP/.vercel/output/config.json"
      - name: Owner-requested production release (single app only)
        shell: bash
        run: |
          set -euo pipefail
          cd "apps/$TARGET_APP"
          ../../node_modules/.bin/vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
          echo "Target $TARGET_APP released from verified main SHA $REQUESTED_SHA"
      - name: Remove downloaded production environment values
        if: always()
        shell: bash
        run: |
          rm -f "apps/${TARGET_APP:-customer}/.env.production.local"
