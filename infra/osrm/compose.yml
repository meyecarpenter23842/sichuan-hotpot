# Dedicated read-only OSRM sidecar; never published to the internet.
# Data must be preprocessed and validated BEFORE starting this service.
# Designed for a city-level car/CH graph, not a country or planet extract.
services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command:
      - osrm-routed
      - --algorithm
      - ch
      - --threads
      - "1"
      - --port
      - "5000"
      - /data/Saigon.osrm
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - /opt/sichuan-hotpot/osrm:/data:ro
    restart: unless-stopped
    read_only: true
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
